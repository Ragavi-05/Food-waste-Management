<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup | FoodWaste AI</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-background"></div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-leaf"></i>
                <h2 id="auth-title">Login</h2>
                <p id="auth-subtitle">Welcome back! Please login to your account</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="login-email" name="email" required>
                    <span class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="login-password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="login-password" name="password" required>
                    <span class="error-message"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="signup-name">
                        <i class="fas fa-user"></i> Full Name
                    </label>
                    <input type="text" id="signup-name" name="name" required>
                    <span class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="signup-email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="signup-email" name="email" required>
                    <span class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="signup-password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="signup-password" name="password" required>
                    <span class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="signup-role">
                        <i class="fas fa-user-tag"></i> Role
                    </label>
                    <select id="signup-role" name="role" required>
                        <option value="">Select Role</option>
                        <option value="manager">Manager</option>
                        <option value="chef">Chef</option>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                    </select>
                    <span class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="signup-kitchen">
                        <i class="fas fa-building"></i> Kitchen/Hotel Name
                    </label>
                    <input type="text" id="signup-kitchen" name="kitchen" required>
                    <span class="error-message"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </form>

            <div class="auth-switch">
                <p id="switch-text">Don't have an account? <a href="#" id="switch-link">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
